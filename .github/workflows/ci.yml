name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (php + js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, phpstan

      - name: Install PHP dev deps
        run: composer install --prefer-dist --no-progress

      - name: PHPCS (WordPress-Extra + Docs, PHP 7.4-8.5)
        run: composer lint

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dev deps
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint JS
        run: npm run lint-js

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is a deliberate legacy-reach decision (SMB hosts); 8.5 is forward-proofing.
        php: ['7.4', '8.1', '8.4', '8.5']
        wp: ['6.4', 'latest']
        exclude:
          # WP 6.4 predates PHP 8.5; the pairing is untestable.
          - php: '8.5'
            wp: '6.4'
          - php: '7.4'
            wp: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer:v2

      - name: Install PHP dev deps
        run: composer install --prefer-dist --no-progress

      - name: Install WordPress + the PHPUnit test scaffold
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "$WP_VERSION" true

      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          # Match wp-env, which reports `local`: the staging lock tests assume it.
          WP_ENVIRONMENT_TYPE: local
        run: vendor/bin/phpunit -c phpunit.xml.dist
